[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterdet"
version = "0.1.0"
description = "Water body detection from Sentinel-2 using NDWI/MNDWI features and a Decision Tree classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.380"]
dev = ["pytest>=7"]
app = ["streamlit>=1.57"]

[project.scripts]
waterdet-run = "waterdet.pipeline:main"
waterdet-gee = "waterdet.gee_export:main"
waterdet-demo = "waterdet.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
